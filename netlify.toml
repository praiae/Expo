[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # ADMIN_EMAIL e ADMIN_REPOR não são segredos (o e-mail é público e "sim" é texto comum);
  # sem isto o scanner de segredos do Netlify bloqueia o build. ADMIN_PASSWORD e APP_SECRET continuam verificados.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_REPOR"

# Cabeçalhos de segurança também para os ficheiros estáticos (as páginas recebem-nos do middleware).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
