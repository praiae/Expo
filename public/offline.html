<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem ligação · Expo Connect Angola</title>
  <meta name="theme-color" content="#2f63e0" />
  <style>
    :root { color-scheme: light dark; --bg: #f0f0f0; --card: #fff; --t: rgb(0 0 0 / .87); --t2: rgb(0 0 0 / .64); --b: rgb(0 0 0 / .1); }
    @media (prefers-color-scheme: dark) { :root { --bg: #212121; --card: #2c2c2c; --t: rgb(255 255 255 / .87); --t2: rgb(255 255 255 / .64); --b: rgb(255 255 255 / .1); } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: var(--bg); color: var(--t); font: 16px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 420px; background: var(--card); border: 1px solid var(--b); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 12px; background: #fff; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { color: var(--t2); margin: 0 0 1.5rem; }
    button { min-height: 48px; padding: 0 1.75rem; border: 0; border-radius: 12px; background: #2f63e0; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>Sem ligação à internet</h1>
    <p>Não foi possível carregar esta página. Verifique a ligação e tente novamente. Os dados da área reservada só ficam disponíveis com ligação.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
